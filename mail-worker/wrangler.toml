name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# 下面三个绑定原来只在 Cloudflare 后台配置，这里按线上实际资源补上（2026-09-25）。
# wrangler deploy 以本文件为准：后台单独加的绑定在下次部署时会被覆盖，
# 连 GitHub 自动构建时是非交互运行，不会提示，部署完 db/kv/r2 就没了。
# 这些是资源 ID，不是密钥，放在公开仓库里没有风险（没有账号权限拿到也用不了）。
[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "mail-cloud"		#d1数据库名字
database_id = "c3ec92f8-1999-4dae-a23f-4e2276d616a7"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "ed374236f4cb446594173abcc1289cb4"					#kv数据库id

[[r2_buckets]]
binding = "r2"			#r2对象存储绑定名默认不可修改
bucket_name = "cloud-mail"		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["mail.font-io.com"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
